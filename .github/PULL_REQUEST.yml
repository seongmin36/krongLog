name: "📝 Docs PR"
description: "블로그 글 작성 / 수정 / 보완에 대한 Pull Request"
title: "[Docs] "
labels: ["docs"]
body:
  - type: input
    id: related-issue
    attributes:
      label: "연관 이슈"
      description: "이 PR이 해결하는 이슈 번호를 입력해주세요."
      placeholder: "closes #"
    validations:
      required: false

  - type: dropdown
    id: pr-type
    attributes:
      label: "PR 유형"
      options:
        - "✍️ 새 글 작성"
        - "🔧 기존 글 수정"
        - "➕ 내용 보완"
        - "🗑️ 글 삭제 / 비공개 처리"
    validations:
      required: true

  - type: textarea
    id: what-changed
    attributes:
      label: "변경 내용 요약"
      description: "이 PR에서 어떤 내용을 작성하거나 변경했는지 설명해주세요."
      placeholder: |
        예: App Router 기본 개념 글 초안 작성.
        기존 getServerSideProps 예시를 Server Component 방식으로 전면 교체.
    validations:
      required: true

  - type: textarea
    id: writing-notes
    attributes:
      label: "작성 시 고려한 점 (선택)"
      description: "글을 쓰면서 특별히 신경 쓴 부분, 의도적으로 제외한 내용, 독자 타겟 등을 남겨주세요."
      placeholder: |
        - 입문자도 읽을 수 있도록 사전 지식 최소화
        - 코드 예시는 실행 가능한 형태로만 작성
        - 너무 길어져서 심화 내용은 다음 편으로 분리 예정

  - type: checkboxes
    id: pr-checklist
    attributes:
      label: "PR 머지 전 체크리스트"
      options:
        - label: "맞춤법 / 오탈자를 검토했습니다."
        - label: "코드 예시가 있다면 실제로 동작하는지 확인했습니다."
        - label: "외부 링크가 있다면 유효한지 확인했습니다."
        - label: "글의 제목, 슬러그, 날짜 메타데이터가 올바르게 작성되었습니다."
